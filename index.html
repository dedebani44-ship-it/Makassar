<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pertempuran Makassar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#111827;
}

iframe{
    width:100%;
    height:100%;
    border:none;
    background:white;
}

.nav{
    position:fixed;
    bottom:20px;
    right:20px;
    display:flex;
    gap:10px;
    z-index:9999;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    background:#2563eb;
    color:white;
    transition:.2s;
}

button:hover{
    background:#1d4ed8;
}

#slideIndicator{
    position:fixed;
    top:20px;
    right:20px;
    background:rgba(0,0,0,.6);
    color:#fff;
    padding:8px 14px;
    border-radius:10px;
    z-index:9999;
}
</style>
</head>

<body>

<div id="slideIndicator"></div>

<iframe id="viewer"></iframe>

<div class="nav">
<button onclick="prevSlide()">⬅ Prev</button>
<button onclick="nextSlide()">Next ➜</button>
</div>

<script>

const slides=[
"slides/cover.html",
"slides/latar-belakang.html",
"slides/kronologi.html",
"slides/tokoh.html",
"slides/dampak.html",
"slides/analisis.html",
"slides/kesimpulan.html",
"slides/penutup.html"
];

let current=0;

const viewer=document.getElementById("viewer");

function loadSlide(){
    viewer.src=slides[current];
    document.getElementById("slideIndicator").innerHTML=
    (current+1)+" / "+slides.length;
}

function nextSlide(){
    if(current<slides.length-1){
        current++;
        loadSlide();
    }
}

function prevSlide(){
    if(current>0){
        current--;
        loadSlide();
    }
}

document.addEventListener("keydown",(e)=>{

if(e.key==="ArrowRight" || e.key===" "){
nextSlide();
}

if(e.key==="ArrowLeft"){
prevSlide();
}

if(e.key==="Home"){
current=0;
loadSlide();
}

if(e.key==="End"){
current=slides.length-1;
loadSlide();
}

});

loadSlide();

</script>

</body>
</html>
